[project]
name = "webtactix-poc"
version = "0.1.0"
description = "WebTactix PoC – goal-driven browser automation with TPE report generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.13.0",
    "openai>=2.53.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
